<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1A1A2E">
<link rel="manifest" href="./manifest.json">
<title>习惯打卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#F0F2F5;color:#1A1A2E;min-height:100vh;overflow-x:hidden}
.app{max-width:520px;margin:0 auto;padding:16px 16px 80px}
.overview-card{background:linear-gradient(135deg,#E8E8ED,#D5D5DF);border-radius:20px;padding:24px 22px;display:flex;align-items:center;gap:20px;margin-bottom:20px;transition:background .5s ease;position:relative;overflow:hidden}
.overview-card.all-done{background:linear-gradient(135deg,#00B894,#00CEC9)}
.overview-card.some-done{background:linear-gradient(135deg,#FDCB6E,#E17055)}
.overview-card .ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.overview-card .ring-wrap svg{transform:rotate(-90deg)}
.overview-card .ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:5}
.overview-card .ring-fg{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.overview-card .ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
.overview-card .info{flex:1;min-width:0}
.overview-card .info .title{font-size:15px;color:rgba(255,255,255,.85);margin-bottom:4px}
.overview-card .info .progress-text{font-size:26px;font-weight:800;color:#fff;line-height:1.2}
.overview-card .info .sub-text{font-size:13px;color:rgba(255,255,255,.75);margin-top:2px}
.overview-card .date-text{font-size:12px;color:rgba(255,255,255,.6);position:absolute;top:16px;right:22px}
.overview-card.empty{background:linear-gradient(135deg,#E0E0E5,#D0D0D8);text-align:center;padding:32px 22px;display:block}
.overview-card.empty .empty-guide{color:rgba(255,255,255,.75);font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.habit-list{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.habit-card{border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);cursor:pointer;transition:all .25s ease;position:relative;overflow:hidden;color:#fff}
.habit-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.habit-card .card-icon{font-size:30px;flex-shrink:0;width:48px;text-align:center;line-height:1}
.habit-card .card-info{flex:1;min-width:0}
.habit-card .habit-name{font-size:17px;font-weight:700;margin-bottom:2px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.habit-card .habit-streak{font-size:36px;font-weight:900;line-height:1;margin-bottom:2px}
.habit-card .habit-streak span{font-size:14px;font-weight:500;opacity:.8;margin-left:2px}
.habit-card .week-progress{display:flex;align-items:center;gap:8px}
.habit-card .week-bar{flex:1;height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.habit-card .week-bar-fill{height:100%;background:rgba(255,255,255,.85);border-radius:3px;transition:width .4s ease}
.habit-card .week-text{font-size:11px;opacity:.8;white-space:nowrap}
.habit-card .badge{position:absolute;top:10px;left:14px;font-size:16px;opacity:.9}
.check-btn{width:50px;height:50px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .25s ease}
.check-btn:hover{background:rgba(255,255,255,.15)}
.check-btn .plus{font-size:26px;color:rgba(255,255,255,.8);font-weight:300;line-height:1}
.check-btn.checked{background:#fff;border:none;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
.check-btn.checked svg{width:24px;height:24px}
.check-btn.checked svg path{stroke:#333;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes popIn{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.empty-state{text-align:center;padding:50px 20px}
.empty-state .empty-icon{font-size:56px;margin-bottom:16px;opacity:.5}
.empty-state h3{font-size:17px;color:#999;margin-bottom:8px;font-weight:500}
.empty-state button{margin-top:12px;padding:12px 32px;background:#4ECDC4;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
.empty-state button:hover{background:#3dbdb5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));box-shadow:0 -2px 12px rgba(0,0,0,.05);z-index:50;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0}
.bottom-nav .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 20px;cursor:pointer;border:none;background:none;font-family:inherit;font-size:10px;color:#B0B0B0;transition:color .2s;min-width:60px}
.bottom-nav .nav-item .nav-icon{font-size:22px;line-height:1}
.bottom-nav .nav-item.active{color:#4ECDC4;font-weight:600}
.add-habit-card{border:2px dashed #D0D0D8;border-radius:18px;padding:20px;text-align:center;color:#B0B0B0;cursor:pointer;transition:all .2s;background:transparent}
.add-habit-card:hover{border-color:#4ECDC4;color:#4ECDC4;background:rgba(78,205,196,.04)}
.add-habit-card .add-icon{font-size:28px;margin-bottom:4px}
.add-habit-card .add-text{font-size:14px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:flex-end;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:0;max-height:88vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
.modal .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0;position:sticky;top:0;background:#fff;z-index:2;border-radius:22px 22px 0 0}
.modal .modal-header h3{font-size:18px;font-weight:700;color:#1A1A2E}
.modal .modal-header .close-btn{width:32px;height:32px;border-radius:50%;border:none;background:#F0F2F5;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;transition:background .2s}
.modal .modal-header .close-btn:hover{background:#E0E0E5}
.modal .modal-body{padding:16px 22px 34px}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;color:#888;margin-bottom:6px;font-weight:600}
.form-group input[type=text]{width:100%;padding:13px 16px;border:2px solid #EEE;border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;background:#F8F9FA}
.form-group input[type=text]:focus{border-color:#4ECDC4;background:#fff}
.emoji-grid{display:flex;flex-wrap:wrap;gap:10px}
.emoji-opt{width:42px;height:42px;border-radius:12px;border:2px solid transparent;background:#F8F9FA;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.emoji-opt:hover{background:#E8E8ED}
.emoji-opt.selected{border-color:#4ECDC4;background:#E0F7F5;transform:scale(1.08)}
.color-grid{display:flex;flex-wrap:wrap;gap:12px}
.color-opt{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s}
.color-opt.selected{border-color:#1A1A2E;transform:scale(1.2);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.freq-row{display:flex;align-items:center;gap:12px}
.freq-row input[type=range]{flex:1;accent-color:#4ECDC4;height:6px}
.freq-row .freq-val{font-size:20px;font-weight:800;color:#4ECDC4;width:36px;text-align:center}
.btn-primary{width:100%;padding:15px;background:#4ECDC4;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:.5px}
.btn-primary:hover{background:#3dbdb5;transform:translateY(-1px);box-shadow:0 4px 14px rgba(78,205,196,.35)}
.btn-danger{width:100%;padding:13px;background:transparent;color:#E74C3C;border:1.5px solid #E74C3C;border-radius:12px;font-size:14px;cursor:pointer;margin-top:12px;font-family:inherit;font-weight:600;transition:all .2s}
.btn-danger:hover{background:#FEF0EF}
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.detail-header .icon-circle{font-size:32px}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat-card{background:#F8F9FA;border-radius:14px;padding:14px 6px;text-align:center}
.stat-card .val{font-size:22px;font-weight:800;color:#1A1A2E;line-height:1.2}
.stat-card .lbl{font-size:11px;color:#999;margin-top:4px}
.heatmap{margin-bottom:20px}
.heatmap .hm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.heatmap .hm-title{font-size:13px;font-weight:600;color:#666}
.heatmap-grid{display:grid;grid-template-columns:24px repeat(7,1fr);gap:3px;align-items:center}
.heatmap-grid .day-label{font-size:10px;color:#B0B0B0;text-align:right;padding-right:4px}
.heatmap-cell{aspect-ratio:1;border-radius:5px;background:#F0F2F5;display:flex;align-items:center;justify-content:center;font-size:10px;color:#B0B0B0;font-weight:600;min-width:0;transition:transform .15s}
.heatmap-cell.today{box-shadow:inset 0 0 0 2.5px rgba(0,0,0,.2)}
.heatmap-cell.filled{color:#fff;font-weight:700}
.heatmap-cell.future{color:transparent;background:#FAFBFC}
.heatmap-legend{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px;font-size:11px;color:#B0B0B0}
.heatmap-legend .dot{width:12px;height:12px;border-radius:3px;background:#F0F2F5;display:inline-block}
.heatmap-legend .dot.filled{background:#4ECDC4}
.stats-page{padding:8px 0}
.stats-page .section-title{font-size:14px;font-weight:700;color:#888;margin-bottom:12px;margin-top:24px;text-transform:uppercase;letter-spacing:1px}
.badge-wall{display:flex;flex-wrap:wrap;gap:12px}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px;background:#fff;border-radius:14px;min-width:72px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.badge-item .badge-icon{font-size:32px}
.badge-item .badge-days{font-size:12px;font-weight:700;color:#666}
.badge-item .badge-status{font-size:10px;color:#B0B0B0}
.badge-item.earned{background:#FFF9E6}
.badge-item.earned .badge-status{color:#E17055;font-weight:600}
.settings-page{padding:8px 0}
.setting-card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.setting-row{display:flex;align-items:center;justify-content:space-between}
.setting-row label{font-size:15px;color:#333}
.setting-row input[type=time]{padding:8px 12px;border:2px solid #EEE;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#F8F9FA}
.toggle{position:relative;width:48px;height:28px;cursor:pointer}
.toggle input{display:none}
.toggle .slider{position:absolute;inset:0;background:#D0D0D8;border-radius:28px;transition:.3s}
.toggle .slider::before{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle input:checked+.slider{background:#4ECDC4}
.toggle input:checked+.slider::before{transform:translateX(20px)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1A1A2E;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:600}
.toast.show{opacity:1}
.particles{position:fixed;inset:0;pointer-events:none;z-index:300}
.particle{position:absolute;border-radius:50%;animation:particleFade .8s ease-out forwards}
@keyframes particleFade{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
@media(min-width:600px){
  .modal{border-radius:22px;margin-bottom:20px}
  .modal-overlay{align-items:center}
  .bottom-nav{border-radius:20px;bottom:8px;left:50%;right:auto;transform:translateX(-50%);width:520px}
}
</style>
</head>
<body>
<div class="app">
  <div class="overview-card empty" id="overviewCard">
    <div class="empty-guide" id="overviewEmpty">+ 添加第一个习惯开始吧</div>
  </div>
  <div class="habit-list" id="habitList"></div>
  <div class="add-habit-card" id="addHabitCard">
    <div class="add-icon">+</div>
    <div class="add-text">添加习惯</div>
  </div>
  <div class="stats-page" id="statsPage" style="display:none"></div>
  <div class="settings-page" id="settingsPage" style="display:none"></div>
</div>
<nav class="bottom-nav">
  <button class="nav-item active" data-tab="habits"><span class="nav-icon">&#x1F4CB;</span>习惯</button>
  <button class="nav-item" data-tab="stats"><span class="nav-icon">&#x1F4CA;</span>统计</button>
  <button class="nav-item" data-tab="settings"><span class="nav-icon">&#x2699;</span>设置</button>
</nav>
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="editTitle">新建习惯</h3>
      <button class="close-btn" onclick="closeEdit()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>习惯名称</label><input type="text" id="habitNameInput" placeholder="例如：早起、运动、阅读…" maxlength="20"></div>
      <div class="form-group"><label>图标</label><div class="emoji-grid" id="emojiGrid"></div></div>
      <div class="form-group"><label>颜色</label><div class="color-grid" id="colorGrid"></div></div>
      <div class="form-group"><label>每周目标天数</label><div class="freq-row"><input type="range" id="freqRange" min="1" max="7" value="7"><span class="freq-val" id="freqVal">7</span></div></div>
      <button class="btn-primary" id="saveHabitBtn">保存</button>
      <button class="btn-danger" id="deleteHabitBtn" style="display:none">删除习惯</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="detailTitle">习惯详情</h3>
      <button class="close-btn" onclick="closeDetail()">&#x2715;</button>
    </div>
    <div class="modal-body" id="detailContent"></div>
  </div>
</div>
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h3>设置</h3>
      <button class="close-btn" onclick="closeSettings()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="setting-row"><label>每日提醒</label><label class="toggle"><input type="checkbox" id="reminderToggle"><span class="slider"></span></label></div>
      <div class="setting-row"><label>提醒时间</label><input type="time" id="reminderTime"></div>
      <button class="btn-primary" id="saveSettingsBtn">保存</button>
      <button class="btn-danger" id="exportDataBtn" style="margin-top:8px">导出数据 (JSON)</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="particles" id="particles"></div>
</parameter>
<script>
// ====== 数据层 ======
const STORAGE_KEY = 'habit_tracker_data';
const SETTINGS_KEY = 'habit_tracker_settings';
const COLORS = ['#FF6B6B','#4ECDC4','#FFD93D','#6C5CE7','#A8E6CF','#FF8C94','#74B9FF','#FDCB6E','#E17055','#00B894'];
const EMOJIS = ['🌅','🏃','📖','💧','🧘','✍️','💻','🎸','📝','🍎','😴','🚭','💰','📚','🏋️','🧹','🎯','💊','🐕','🎨'];

let habits = loadHabits();
let settings = loadSettings();
let editingId = null;
let currentTab = 'habits';

function loadHabits() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
function saveHabits() { localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); }
function loadSettings() { try { const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); return { reminderEnabled: s.reminderEnabled || false, reminderTime: s.reminderTime || '08:00' }; } catch { return { reminderEnabled: false, reminderTime: '08:00' }; } }
function saveSettingsData() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

function todayStr() { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getMonday(d) { const r = new Date(d); r.setDate(r.getDate()-((r.getDay()+6)%7)); return r; }
function addDays(d,n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }

function currentStreak(h) {
  let d = new Date(); let today = dateStr(d); let count = 0;
  let cursor = h.checkins[today] ? new Date() : addDays(new Date(),-1);
  while (true) {
    if (h.checkins[dateStr(cursor)]) { count++; cursor = addDays(cursor,-1); }
    else break;
  }
  return count;
}
function longestStreak(h) {
  const dates = Object.keys(h.checkins).filter(k=>h.checkins[k]).sort();
  if (!dates.length) return 0;
  let max=1,cur=1;
  for (let i=1;i<dates.length;i++) {
    const prev=new Date(dates[i-1]),curr=new Date(dates[i]);
    if ((curr-prev)/86400000===1){cur++;max=Math.max(max,cur);}
    else{cur=1;}
  }
  return max;
}
function totalCheckins(h) { return Object.keys(h.checkins).filter(k=>h.checkins[k]).length; }
function completionRate(h) {
  const created = new Date(h.createdAt); const today = new Date();
  const days = Math.max(1,Math.floor((today-created)/86400000)+1);
  return Math.round(totalCheckins(h)/days*100);
}
function weekProgress(h) {
  const monday = getMonday(new Date()); let count=0;
  for (let i=0;i<7;i++) { if (h.checkins[dateStr(addDays(monday,i))]) count++; }
  return {done:count,target:h.targetFrequency};
}

// ====== Toast ======
const toastEl = document.getElementById('toast');
function showToast(msg) { toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800); }

// ====== 粒子动画 ======
function spawnParticles(x,y,color) {
  const container = document.getElementById('particles');
  for (let i=0;i<12;i++) {
    const p = document.createElement('div'); p.className='particle';
    const angle = (Math.PI*2/12)*i; const dist = 30+Math.random()*40;
    p.style.cssText = `left:${x}px;top:${y}px;width:6px;height:6px;background:${color};--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px`;
    container.appendChild(p);
    setTimeout(()=>p.remove(),800);
  }
}

// ====== 今日概览 ======
function renderOverview() {
  const card = document.getElementById('overviewCard');
  const empty = document.getElementById('overviewEmpty');
  const today = todayStr();

  if (!habits.length) {
    card.className = 'overview-card empty';
    card.innerHTML = '<div class="empty-guide" id="overviewEmpty" onclick="openEditModal(null)">+ 添加第一个习惯开始吧</div>';
    return;
  }

  const done = habits.filter(h=>h.checkins[today]).length;
  const total = habits.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const circumference = 62 * Math.PI;

  card.className = 'overview-card' + (done===total ? ' all-done' : (done>0?' some-done':''));

  const d = new Date();
  const days = ['日','一','二','三','四','五','六'];
  const dateLabel = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${days[d.getDay()]}`;

  card.innerHTML = `
    <div class="date-text">${dateLabel}</div>
    <div class="ring-wrap">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle class="ring-bg" cx="36" cy="36" r="31"/>
        <circle class="ring-fg" cx="36" cy="36" r="31"
          stroke-dasharray="${circumference}" stroke-dashoffset="${circumference * (1-pct/100)}"/>
      </svg>
      <div class="ring-text">${pct}%</div>
    </div>
    <div class="info">
      <div class="title">今日完成</div>
      <div class="progress-text">${done} / ${total} 项</div>
      <div class="sub-text">${pct===100?'全部完成，真棒！':(pct===0?'今天还没开始哦':'继续加油！')}</div>
    </div>
  `;
}

// ====== 徽章系统 ======
function getBadge(streak) {
  if (streak>=365) return {icon:'💎',name:'钻石徽章',days:365};
  if (streak>=100) return {icon:'🥇',name:'金牌徽章',days:100};
  if (streak>=30) return {icon:'🥈',name:'银牌徽章',days:30};
  if (streak>=7) return {icon:'🥉',name:'铜牌徽章',days:7};
  return null;
}

// ====== 习惯列表渲染 ======
function renderHabits() {
  const list = document.getElementById('habitList');
  if (!habits.length) {
    list.innerHTML = '';
    return;
  }
  const today = todayStr();
  list.innerHTML = habits.map(h=>{
    const checked = !!h.checkins[today];
    const wp = weekProgress(h);
    const pct = Math.min(100,Math.round(wp.done/wp.target*100));
    const cs = currentStreak(h);
    const badge = getBadge(cs);
    return `
      <div class="habit-card" style="background:linear-gradient(135deg,${h.color},${h.color}dd)" data-id="${h.id}">
        ${badge?`<div class="badge" title="${badge.name}">${badge.icon}</div>`:''}
        <div class="card-icon">${h.icon}</div>
        <div class="card-info">
          <div class="habit-name">${escH(h.name)}</div>
          <div class="habit-streak">${cs}<span>天</span></div>
          <div class="week-progress">
            <div class="week-bar"><div class="week-bar-fill" style="width:${pct}%"></div></div>
            <span class="week-text">本周 ${wp.done}/${wp.target}</span>
          </div>
        </div>
        <button class="check-btn${checked?' checked':''}" data-check="${h.id}">
          ${checked?'<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>':'<span class="plus">+</span>'}
        </button>
      </div>`;
  }).join('');
}

function escH(s) { const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

// ====== 打卡事件 ======
document.getElementById('habitList').addEventListener('click',e=>{
  const btn = e.target.closest('.check-btn');
  const card = e.target.closest('.habit-card');
  if (btn) {
    e.stopPropagation();
    toggleCheckin(Number(btn.dataset.check), btn);
  } else if (card) {
    openDetail(Number(card.dataset.id));
  }
});

function toggleCheckin(id, btnEl) {
  const h = habits.find(x=>x.id===id); if(!h) return;
  const today = todayStr();
  if (h.checkins[today]) { delete h.checkins[today]; }
  else {
    h.checkins[today]=true;
    if (btnEl) {
      const rect = btnEl.getBoundingClientRect();
      spawnParticles(rect.left+rect.width/2, rect.top+rect.height/2, h.color);
    }
  }
  saveHabits(); renderAll();
}

// ====== 详情弹窗 ======
function openDetail(id) {
  const h = habits.find(x=>x.id===id); if(!h) return;
  const cs=currentStreak(h),ls=longestStreak(h),tc=totalCheckins(h),cr=completionRate(h);
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-header">
      <div class="icon-circle">${h.icon}</div>
      <div><h3 style="margin:0;font-size:18px">${escH(h.name)}</h3></div>
    </div>
    <div class="stat-cards">
      <div class="stat-card"><div class="val">${cs}</div><div class="lbl">当前连续</div></div>
      <div class="stat-card"><div class="val">${ls}</div><div class="lbl">历史最长</div></div>
      <div class="stat-card"><div class="val">${tc}</div><div class="lbl">总打卡</div></div>
      <div class="stat-card"><div class="val">${cr}%</div><div class="lbl">完成率</div></div>
    </div>
    ${buildHeatmap(h)}
    <button class="btn-danger" onclick="deleteHabit(${id})">删除习惯</button>
  `;
  document.getElementById('detailModal').classList.add('show');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('show'); }

// ====== 热力图 ======
function buildHeatmap(h) {
  const today = new Date();
  const endDate = new Date(today.getFullYear(), today.getMonth()+1, 0);
  if (today < endDate) endDate.setTime(today.getTime());
  const startDate = new Date(endDate.getFullYear(), endDate.getMonth()-1, 1);
  const totalDays = Math.floor((endDate-startDate)/86400000)+1;
  const firstDayOfWeek = startDate.getDay()===0?6:startDate.getDay()-1;
  const weeks = Math.ceil((totalDays+firstDayOfWeek)/7);
  const todayS = todayStr();
  const dayLabels = ['一','二','三','四','五','六','日'];

  let html = '<div class="heatmap"><div class="hm-header"><span class="hm-title">打卡热力图</span></div><div class="heatmap-grid">';

  for (let r=0;r<7;r++) {
    html += `<div class="day-label">${dayLabels[r]}</div>`;
    for (let c=0;c<weeks;c++) {
      const dayIdx = c*7+r-firstDayOfWeek;
      if (dayIdx<0||dayIdx>=totalDays) {
        html += '<div class="heatmap-cell future"></div>';
        continue;
      }
      const d = addDays(startDate,dayIdx);
      const ds = dateStr(d);
      const checked = !!h.checkins[ds];
      const isToday = ds===todayS;
      const inFuture = d>today;
      html += `<div class="heatmap-cell${checked?' filled':''}${isToday?' today':''}${inFuture&&!checked?' future':''}"
        style="${checked?'background:'+h.color:''}">${d.getDate()}</div>`;
    }
  }
  html += '</div><div class="heatmap-legend"><span class="dot"></span> 未打卡 <span class="dot filled"></span> 已打卡</div></div>';
  return html;
}

function deleteHabit(id) {
  if (!confirm('确定删除这个习惯？所有打卡记录将丢失。')) return;
  habits = habits.filter(x=>x.id!==id);
  saveHabits(); renderAll(); closeDetail();
}

// ====== 编辑弹窗 ======
function openEditModal(id) {
  editingId = id;
  const title = document.getElementById('editTitle');
  const nameInput = document.getElementById('habitNameInput');
  const freqRange = document.getElementById('freqRange');
  const freqVal = document.getElementById('freqVal');
  const deleteBtn = document.getElementById('deleteHabitBtn');

  const emojiGrid = document.getElementById('emojiGrid');
  const colorGrid = document.getElementById('colorGrid');
  emojiGrid.innerHTML = EMOJIS.map(e=>`<button class="emoji-opt" data-emoji="${e}">${e}</button>`).join('');
  colorGrid.innerHTML = COLORS.map(c=>`<button class="color-opt" style="background:${c}" data-color="${c}"></button>`).join('');

  let selEmoji=EMOJIS[0], selColor=COLORS[0];

  if (id) {
    const h=habits.find(x=>x.id===id); if(!h) return;
    title.textContent='编辑习惯';
    nameInput.value=h.name;
    freqRange.value=h.targetFrequency;
    freqVal.textContent=h.targetFrequency;
    deleteBtn.style.display='block';
    selEmoji=h.icon; selColor=h.color;
  } else {
    title.textContent='新建习惯';
    nameInput.value='';
    freqRange.value=7;
    freqVal.textContent='7';
    deleteBtn.style.display='none';
  }

  document.querySelector(`[data-emoji="${selEmoji}"]`)?.classList.add('selected');
  document.querySelector(`[data-color="${selColor}"]`)?.classList.add('selected');

  freqRange.oninput = () => { freqVal.textContent=freqRange.value; };

  emojiGrid.onclick = (e) => {
    const el = e.target.closest('.emoji-opt'); if(!el) return;
    emojiGrid.querySelectorAll('.emoji-opt').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected'); selEmoji=el.dataset.emoji;
  };

  colorGrid.onclick = (e) => {
    const el = e.target.closest('.color-opt'); if(!el) return;
    colorGrid.querySelectorAll('.color-opt').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected'); selColor=el.dataset.color;
  };

  document.getElementById('saveHabitBtn').onclick = () => {
    const name = nameInput.value.trim();
    if(!name){showToast('请输入习惯名称');return;}
    const freq=parseInt(freqRange.value);
    if(id){
      const h=habits.find(x=>x.id===id);
      if(h){h.name=name;h.icon=selEmoji;h.color=selColor;h.targetFrequency=freq;}
    }else{
      habits.push({id:Date.now(),name,icon:selEmoji,color:selColor,targetFrequency:freq,createdAt:todayStr(),checkins:{}});
    }
    saveHabits();renderAll();closeEdit();
  };

  deleteBtn.onclick = () => {
    if(!confirm('确定删除？'))return;
    habits=habits.filter(x=>x.id!==id);
    saveHabits();renderAll();closeEdit();
  };

  document.getElementById('editModal').classList.add('show');
}

function closeEdit() { document.getElementById('editModal').classList.remove('show'); }

// ====== 设置弹窗 ======
function openSettings() {
  document.getElementById('reminderToggle').checked = settings.reminderEnabled;
  document.getElementById('reminderTime').value = settings.reminderTime;
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }

document.getElementById('saveSettingsBtn').addEventListener('click',()=>{
  settings.reminderEnabled = document.getElementById('reminderToggle').checked;
  settings.reminderTime = document.getElementById('reminderTime').value;
  saveSettingsData(); closeSettings(); showToast('设置已保存');
  if(settings.reminderEnabled && Notification.permission!=='granted'){Notification.requestPermission();}
});

document.getElementById('exportDataBtn').addEventListener('click',()=>{
  const blob = new Blob([JSON.stringify({habits,settings,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habit-tracker-backup.json';a.click();
  showToast('数据已导出'); closeSettings();
});

// ====== 统计页 ======
function renderStats() {
  const page = document.getElementById('statsPage');
  if (!habits.length) {
    page.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><h3>还没有数据</h3></div>';
    return;
  }

  let badgeHTML = '';
  const allBadges = [{icon:'💎',days:365,name:'钻石徽章'},{icon:'🥇',days:100,name:'金牌徽章'},{icon:'🥈',days:30,name:'银牌徽章'},{icon:'🥉',days:7,name:'铜牌徽章'}];
  const maxStreaks = habits.map(h=>longestStreak(h));
  const bestStreak = Math.max(...maxStreaks);

  badgeHTML = allBadges.map(b=>{
    const earned = bestStreak >= b.days;
    return `<div class="badge-item${earned?' earned':''}"><div class="badge-icon">${b.icon}</div><div class="badge-days">${b.days}天</div><div class="badge-status">${earned?'已获得':'未达成'}</div></div>`;
  }).join('');

  // 总览统计
  const totalDays = habits.reduce((s,h)=>s+totalCheckins(h),0);
  const todayDone = habits.filter(h=>h.checkins[todayStr()]).length;

  page.innerHTML = `
    <div class="section-title">总览</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px">
      <div class="stat-card"><div class="val">${habits.length}</div><div class="lbl">习惯总数</div></div>
      <div class="stat-card"><div class="val">${totalDays}</div><div class="lbl">累计打卡</div></div>
      <div class="stat-card"><div class="val">${todayDone}/${habits.length}</div><div class="lbl">今日完成</div></div>
      <div class="stat-card"><div class="val">${bestStreak}</div><div class="lbl">最佳连续</div></div>
    </div>
    <div class="section-title">徽章</div>
    <div class="badge-wall">${badgeHTML}</div>
  `;
}

// ====== 导航切换 ======
document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    currentTab = item.dataset.tab;
    switchTab();
  });
});

function switchTab() {
  const habitSection = document.getElementById('habitList').parentElement;
  const addCard = document.getElementById('addHabitCard');
  const overview = document.getElementById('overviewCard');
  const statsPage = document.getElementById('statsPage');
  const settingsPage = document.getElementById('settingsPage');

  // 需要隐藏 habitList 和 overview，通过他们的父容器
  const habitContainer = document.getElementById('habitList');
  const listParent = habitContainer.parentElement;

  if (currentTab==='habits') {
    overview.style.display='';
    habitContainer.style.display='';
    addCard.style.display='';
    statsPage.style.display='none';
    settingsPage.style.display='none';
    document.querySelectorAll('.habit-list,.add-habit-card,.overview-card').forEach(el=>el.style.display='');
  } else if (currentTab==='stats') {
    overview.style.display='none';
    habitContainer.style.display='none';
    addCard.style.display='none';
    document.querySelectorAll('.habit-list,.add-habit-card').forEach(el=>el.style.display='none');
    document.querySelectorAll('.overview-card').forEach(el=>el.style.display='none');
    statsPage.style.display='';
    settingsPage.style.display='none';
    renderStats();
  } else if (currentTab==='settings') {
    overview.style.display='none';
    habitContainer.style.display='none';
    addCard.style.display='none';
    document.querySelectorAll('.habit-list,.add-habit-card,.overview-card').forEach(el=>el.style.display='none');
    statsPage.style.display='none';
    settingsPage.style.display='';
    renderSettings();
  }
}

function renderSettings() {
  const page = document.getElementById('settingsPage');
  page.innerHTML = `
    <div class="setting-card" onclick="openSettings()" style="cursor:pointer">
      <div class="setting-row">
        <label>提醒与导出设置</label>
        <span style="color:#B0B0B0;font-size:14px">→</span>
      </div>
    </div>
    <div class="setting-card">
      <div class="setting-row">
        <label>版本</label>
        <span style="color:#B0B0B0;font-size:14px">2.0.0</span>
      </div>
    </div>
  `;
}

// ====== 弹窗关闭 ======
document.getElementById('editModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEdit();});
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail();});
document.getElementById('settingsModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSettings();});

// ====== 添加习惯入口 ======
document.getElementById('addHabitCard').addEventListener('click',()=>openEditModal(null));
document.getElementById('overviewCard').addEventListener('click',e=>{
  if(e.target.id==='overviewEmpty'||e.target.closest('.empty-guide'))openEditModal(null);
});

// ====== 提醒检查 ======
function checkReminder() {
  if(!settings.reminderEnabled||Notification.permission!=='granted')return;
  const now=new Date();
  const timeStr=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(timeStr!==settings.reminderTime)return;
  const today=todayStr();
  const unchecked=habits.filter(h=>!h.checkins[today]);
  if(unchecked.length===0)return;
  const lastReminder=sessionStorage.getItem('last_reminder_date');
  if(lastReminder===today)return;
  sessionStorage.setItem('last_reminder_date',today);
  new Notification('习惯打卡',{body:`还有 ${unchecked.length} 个习惯未完成，加油！`,tag:'habit-reminder'});
}

// ====== PWA ======
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}

// ====== 全局渲染 ======
function renderAll() { renderOverview(); renderHabits(); if(currentTab==='stats')renderStats(); if(currentTab==='settings')renderSettings(); }

// ====== 初始化 ======
renderAll();
setInterval(checkReminder,30000);
</script>
