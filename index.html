
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0D1117">
<link rel="manifest" href="./manifest.json">
<title>习惯打卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0D1117;color:#E6EDF3;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{max-width:520px;margin:0 auto;padding:20px 16px 90px;position:relative;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.header h1{font-size:26px;font-weight:800;color:#E6EDF3;letter-spacing:-0.5px}
.header .date-sub{font-size:13px;color:#8B949E;margin-top:2px}
.header .gear-btn{width:40px;height:40px;border-radius:12px;background:#21262D;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#8B949E;font-size:20px;transition:all .2s}
.header .gear-btn:hover{background:#30363D;color:#E6EDF3}

/* Overview Card */
.overview-card{background:#161B22;border-radius:20px;padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:20px;position:relative;overflow:hidden;transition:all .5s ease;border:1px solid #21262D}
.overview-card.all-done{background:linear-gradient(135deg,#1B4332,#1B4332);border-color:#2D6A4F}
.overview-card .ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.overview-card .ring-wrap svg{transform:rotate(-90deg)}
.overview-card .ring-bg{fill:none;stroke:#21262D;stroke-width:6}
.overview-card .ring-fg{fill:none;stroke:#3FB950;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.overview-card.all-done .ring-bg{stroke:rgba(255,255,255,.15)}
.overview-card.all-done .ring-fg{stroke:#fff}
.overview-card .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.overview-card .ring-text .pct{font-size:22px;font-weight:900;color:#E6EDF3}
.overview-card .ring-text .label{font-size:10px;color:#8B949E;margin-top:1px}
.overview-card .info{flex:1;min-width:0}
.overview-card .info .title{font-size:13px;color:#8B949E;margin-bottom:4px;font-weight:500}
.overview-card .info .progress-text{font-size:24px;font-weight:800;color:#E6EDF3;line-height:1.2}
.overview-card .info .sub-text{font-size:13px;color:#8B949E;margin-top:2px}
.overview-card.all-done .info .title,.overview-card.all-done .info .sub-text{color:rgba(255,255,255,.7)}
.overview-card.all-done .info .progress-text{color:#fff}
.overview-card.empty-state{justify-content:center;padding:32px 24px;text-align:center;display:block}
.overview-card.empty-state .empty-guide{color:#58A6FF;font-size:15px;cursor:pointer;font-weight:500;display:inline-block;border-bottom:1px dashed #58A6FF;padding-bottom:2px}
.overview-card.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.4;display:block}

/* Habit Cards */
.habit-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.habit-card{background:#161B22;border-radius:16px;padding:0;display:flex;align-items:stretch;height:80px;cursor:pointer;position:relative;overflow:hidden;border:1px solid #21262D;transition:all .25s ease}
.habit-card:active{transform:scale(.98)}
.habit-card.today-done{border-color:rgba(63,185,80,.3);background:#161B22}
.habit-card .strip{width:5px;flex-shrink:0;border-radius:16px 0 0 16px}
.habit-card .card-body{flex:1;display:flex;align-items:center;padding:0 16px;min-width:0;gap:12px}
.habit-card .card-icon{font-size:28px;flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05)}
.habit-card .card-info{flex:1;min-width:0}
.habit-card .habit-name{font-size:16px;font-weight:700;color:#E6EDF3;margin-bottom:1px}
.habit-card .habit-streak{font-size:30px;font-weight:900;line-height:1;color:#E6EDF3}
.habit-card .habit-streak span{font-size:12px;font-weight:500;opacity:.5;margin-left:1px}
.habit-card .rhythm-dots{display:flex;gap:4px;margin-top:3px}
.habit-card .rhythm-dot{width:7px;height:7px;border-radius:50%;background:#21262D;transition:all .3s ease}
.habit-card .rhythm-dot.active{background:currentColor}
.habit-card .rhythm-dot.today{border:2px solid currentColor;background:transparent;width:9px;height:9px;margin:-1px}
.habit-card .check-ring{flex-shrink:0;position:relative;width:44px;height:44px}
.habit-card .check-ring svg{transform:rotate(-90deg)}
.habit-card .check-ring .cr-bg{fill:none;stroke:#21262D;stroke-width:3}
.habit-card .check-ring .cr-fg{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.habit-card .check-ring .cr-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:currentColor;opacity:.6}
.habit-card.today-done .check-ring .cr-center{opacity:1}
.habit-card.today-done .check-ring .cr-fg{stroke:#3FB950}
.habit-card.today-done .check-ring .cr-bg{stroke:rgba(63,185,80,.2)}
/* Ripple */
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.15);transform:scale(0);animation:rippleAnim .6s ease-out forwards;pointer-events:none}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

/* Add Habit */
.add-habit-card{border:1.5px dashed #30363D;border-radius:16px;padding:18px;text-align:center;color:#484F58;cursor:pointer;transition:all .2s;background:transparent;margin-bottom:16px}
.add-habit-card:hover{border-color:#58A6FF;color:#58A6FF}
.add-habit-card .add-icon{font-size:26px;margin-bottom:2px;font-weight:300}
.add-habit-card .add-text{font-size:14px;font-weight:500}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,17,23,.92);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0));border-top:1px solid #21262D;z-index:50;max-width:520px;margin:0 auto;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bottom-nav .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 24px;cursor:pointer;border:none;background:none;font-family:inherit;font-size:10px;color:#484F58;transition:color .2s;font-weight:500}
.bottom-nav .nav-item .nav-icon{font-size:20px;line-height:1}
.bottom-nav .nav-item.active{color:#58A6FF}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:flex-end;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:#161B22;border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:0;max-height:88vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1);border:1px solid #21262D;border-bottom:none}
.modal .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0;position:sticky;top:0;background:#161B22;z-index:2;border-radius:22px 22px 0 0}
.modal .modal-header h3{font-size:18px;font-weight:700;color:#E6EDF3}
.modal .modal-header .close-btn{width:32px;height:32px;border-radius:50%;border:none;background:#21262D;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#8B949E;transition:background .2s}
.modal .modal-header .close-btn:hover{background:#30363D}
.modal .modal-body{padding:16px 22px 34px}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

/* Form */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:#8B949E;margin-bottom:6px;font-weight:600}
.form-group input[type=text]{width:100%;padding:13px 16px;border:1.5px solid #21262D;border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;background:#0D1117;color:#E6EDF3}
.form-group input[type=text]:focus{border-color:#58A6FF}
.emoji-grid{display:flex;flex-wrap:wrap;gap:10px}
.emoji-opt{width:42px;height:42px;border-radius:12px;border:2px solid #21262D;background:#0D1117;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.emoji-opt:hover{border-color:#30363D}
.emoji-opt.selected{border-color:#58A6FF;background:rgba(88,166,255,.1)}
.color-grid{display:flex;flex-wrap:wrap;gap:12px}
.color-opt{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s}
.color-opt.selected{border-color:#E6EDF3;transform:scale(1.2);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.freq-row{display:flex;align-items:center;gap:12px}
.freq-row input[type=range]{flex:1;accent-color:#58A6FF;height:6px}
.freq-row .freq-val{font-size:20px;font-weight:800;color:#58A6FF;width:36px;text-align:center}
.btn-primary{width:100%;padding:15px;background:#238636;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:.3px}
.btn-primary:hover{background:#2EA043}
.btn-danger{width:100%;padding:13px;background:transparent;color:#F85149;border:1.5px solid #F85149;border-radius:12px;font-size:14px;cursor:pointer;margin-top:12px;font-family:inherit;font-weight:600;transition:all .2s}
.btn-danger:hover{background:rgba(248,81,73,.1)}

/* Detail Modal */
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.detail-header .icon-circle{font-size:32px;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05)}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat-card{background:#0D1117;border-radius:12px;padding:14px 4px;text-align:center;border:1px solid #21262D}
.stat-card .val{font-size:20px;font-weight:800;color:#E6EDF3;line-height:1.2}
.stat-card .lbl{font-size:10px;color:#8B949E;margin-top:4px}

/* Calendar Heatmap */
.heatmap{margin-bottom:16px}
.heatmap .hm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.heatmap .hm-title{font-size:13px;font-weight:600;color:#8B949E}
.heatmap-grid{display:grid;grid-template-columns:24px repeat(7,1fr);gap:3px;align-items:center}
.heatmap-grid .day-label{font-size:10px;color:#484F58;text-align:right;padding-right:4px}
.heatmap-cell{aspect-ratio:1;border-radius:5px;background:#21262D;display:flex;align-items:center;justify-content:center;font-size:10px;color:#484F58;font-weight:600;min-width:0}
.heatmap-cell.today{box-shadow:inset 0 0 0 2px rgba(88,166,255,.6)}
.heatmap-cell.filled{color:#fff;font-weight:700}
.heatmap-cell.future{color:transparent;background:#0D1117}
.heatmap-legend{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px;font-size:11px;color:#8B949E}
.heatmap-legend .dot{width:12px;height:12px;border-radius:3px;background:#21262D;display:inline-block}
.heatmap-legend .dot.filled{background:#3FB950}

/* Calendar/Insights Pages */
.page-content{padding:4px 0}
.page-content .section-title{font-size:13px;font-weight:700;color:#8B949E;margin-bottom:12px;margin-top:20px;text-transform:uppercase;letter-spacing:1px}
.page-content .section-title:first-child{margin-top:0}

/* Pulse Wave Chart (calendar page) */
.pulse-chart{background:#161B22;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid #21262D}
.pulse-chart .pc-title{font-size:13px;color:#8B949E;margin-bottom:12px;font-weight:600}

/* Badge Wall */
.badge-wall{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 16px;background:#161B22;border-radius:14px;min-width:74px;border:1px solid #21262D;transition:all .3s ease}
.badge-item .badge-icon{font-size:28px}
.badge-item .badge-days{font-size:11px;font-weight:700;color:#8B949E}
.badge-item .badge-status{font-size:10px;color:#484F58}
.badge-item.earned{border-color:rgba(88,166,255,.3);background:rgba(88,166,255,.06)}
.badge-item.earned .badge-status{color:#58A6FF;font-weight:600}

/* Bar chart for insights */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row .bar-label{width:48px;font-size:12px;color:#8B949E;text-align:right;font-weight:500;flex-shrink:0}
.bar-row .bar-track{flex:1;height:8px;background:#21262D;border-radius:4px;overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.bar-row .bar-pct{font-size:11px;color:#8B949E;width:32px;text-align:right;font-weight:600;flex-shrink:0}

/* Trend line chart */
.trend-chart{background:#161B22;border-radius:14px;padding:18px;border:1px solid #21262D;margin-bottom:14px}

/* Habit Selector */
.habit-selector{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.habit-selector::-webkit-scrollbar{display:none}
.habit-selector .hs-chip{padding:8px 16px;border-radius:20px;border:1.5px solid #21262D;background:transparent;color:#8B949E;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit;flex-shrink:0}
.habit-selector .hs-chip.active{border-color:currentColor;color:#E6EDF3;background:rgba(255,255,255,.05)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#30363D;color:#E6EDF3;padding:12px 24px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:600;border:1px solid #484F58}
.toast.show{opacity:1}

/* Settings */
.setting-card{background:#161B22;border-radius:14px;padding:16px 18px;margin-bottom:10px;border:1px solid #21262D;cursor:pointer;transition:all .2s}
.setting-card:hover{background:#1C2128}
.setting-row{display:flex;align-items:center;justify-content:space-between}
.setting-row label{font-size:15px;color:#E6EDF3}
.setting-row input[type=time]{padding:8px 12px;border:1.5px solid #21262D;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#0D1117;color:#E6EDF3}
.toggle{position:relative;width:48px;height:28px;cursor:pointer}
.toggle input{display:none}
.toggle .slider{position:absolute;inset:0;background:#21262D;border-radius:28px;transition:.3s}
.toggle .slider::before{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#484F58;top:2px;left:2px;transition:.3s}
.toggle input:checked+.slider{background:#238636}
.toggle input:checked+.slider::before{background:#fff;transform:translateX(20px)}

@media(min-width:600px){
  .modal{border-radius:22px;margin-bottom:20px}
  .modal-overlay{align-items:center}
  .bottom-nav{border-radius:16px 16px 0 0}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>习惯打卡</h1>
      <div class="date-sub" id="dateSub"></div>
    </div>
    <button class="gear-btn" id="gearBtn">&#9881;</button>
  </div>
  <div class="overview-card empty-state" id="overviewCard">
    <span class="empty-icon">&#9200;</span>
    <span class="empty-guide" id="overviewEmpty">+ 添加第一个习惯</span>
  </div>
  <div class="habit-list" id="habitList"></div>
  <div class="add-habit-card" id="addHabitCard">
    <div class="add-icon">+</div>
    <div class="add-text">添加习惯</div>
  </div>
  <div class="page-content" id="calendarPage" style="display:none"></div>
  <div class="page-content" id="insightsPage" style="display:none"></div>
  <div class="page-content" id="settingsPage" style="display:none"></div>
</div>
<nav class="bottom-nav">
  <button class="nav-item active" data-tab="habits"><span class="nav-icon">&#x25C9;</span>今日</button>
  <button class="nav-item" data-tab="calendar"><span class="nav-icon">&#x1F4C5;</span>日历</button>
  <button class="nav-item" data-tab="insights"><span class="nav-icon">&#x1F4C8;</span>洞察</button>
</nav>


<!-- Modals -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="editTitle">新建习惯</h3>
      <button class="close-btn" id="editCloseBtn">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>习惯名称</label><input type="text" id="habitNameInput" placeholder="例如：早起、运动、阅读…" maxlength="20"></div>
      <div class="form-group"><label>图标</label><div class="emoji-grid" id="emojiGrid"></div></div>
      <div class="form-group"><label>颜色</label><div class="color-grid" id="colorGrid"></div></div>
      <div class="form-group"><label>每周目标天数</label><div class="freq-row"><input type="range" id="freqRange" min="1" max="7" value="7"><span class="freq-val" id="freqVal">7</span></div></div>
      <button class="btn-primary" id="saveHabitBtn">保存</button>
      <button class="btn-danger" id="deleteHabitBtn" style="display:none">删除习惯</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="detailTitle">习惯详情</h3>
      <button class="close-btn" id="detailCloseBtn">&#x2715;</button>
    </div>
    <div class="modal-body" id="detailContent"></div>
  </div>
</div>
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h3>设置</h3>
      <button class="close-btn" id="settingsCloseBtn">&#x2715;</button>
    </div>
    <div class="modal-body" id="settingsContent">
      <div class="form-group"><label>每日提醒</label>
        <div class="setting-row">
          <label style="font-size:14px">启用每日通知</label>
          <label class="toggle"><input type="checkbox" id="reminderToggle"><span class="slider"></span></label>
        </div>
      </div>
      <div class="form-group"><label>提醒时间</label>
        <input type="time" id="reminderTime" style="width:100%;padding:13px 16px;border:1.5px solid #21262D;border-radius:12px;background:#0D1117;color:#E6EDF3;font-size:15px">
      </div>
      <button class="btn-primary" id="saveSettingsBtn">保存设置</button>
      <button class="btn-danger" id="exportDataBtn" style="margin-top:8px">导出数据 (JSON)</button>
      <div style="text-align:center;margin-top:24px;color:#484F58;font-size:12px">习惯打卡 v3.0</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// ====== Data Layer ======
const STORAGE_KEY = 'habit_tracker_data';
const SETTINGS_KEY = 'habit_tracker_settings';
const COLORS = ['#58A6FF','#3FB950','#D2A8FF','#F0883E','#F78166','#79C0FF','#D29922','#FF7B72','#A5D6FF','#56D364'];
const EMOJIS = ['\u{1F305}','\u{1F3C3}','\u{1F4D6}','\u{1F4A7}','\u{1F9D8}','\u{270D}\u{FE0F}','\u{1F4BB}','\u{1F3B8}','\u{1F4DD}','\u{1F34E}','\u{1F634}','\u{1F6AD}','\u{1F4B0}','\u{1F4DA}','\u{1F3CB}\u{FE0F}','\u{1F9FD}','\u{1F3AF}','\u{1F48A}','\u{1F436}','\u{1F3A8}'];

let habits = loadHabits();
let settings = loadSettings();
let editingId = null;
let currentTab = 'habits';
let selectedCalHabitId = null;

function loadHabits() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
function saveHabits() { localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); }
function loadSettings() { try { const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); return { reminderEnabled: s.reminderEnabled || false, reminderTime: s.reminderTime || '08:00' }; } catch { return { reminderEnabled: false, reminderTime: '08:00' }; } }
function saveSettingsData() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

function todayStr() { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getMonday(d) { const r = new Date(d); r.setDate(r.getDate()-((r.getDay()+6)%7)); return r; }
function addDays(d,n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function escH(s) { const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

function currentStreak(h) {
  let count = 0;
  let cursor = new Date();
  const todayS = todayStr();
  if (!h.checkins[todayS]) cursor = addDays(cursor,-1);
  while (true) {
    if (h.checkins[dateStr(cursor)]) { count++; cursor = addDays(cursor,-1); }
    else break;
  }
  return count;
}
function longestStreak(h) {
  const dates = Object.keys(h.checkins).filter(k=>h.checkins[k]).sort();
  if (!dates.length) return 0;
  let max=1,cur=1;
  for (let i=1;i<dates.length;i++) {
    const prev=new Date(dates[i-1]),curr=new Date(dates[i]);
    if ((curr-prev)/86400000===1){cur++;max=Math.max(max,cur);}
    else{cur=1;}
  }
  return max;
}
function totalCheckins(h) { return Object.keys(h.checkins).filter(k=>h.checkins[k]).length; }
function weekProgress(h) {
  const monday = getMonday(new Date()); let count=0;
  for (let i=0;i<7;i++) { if (h.checkins[dateStr(addDays(monday,i))]) count++; }
  return {done:count,target:h.targetFrequency};
}
function completionRate(h) {
  const created = new Date(h.createdAt); const today = new Date();
  const days = Math.max(1,Math.floor((today-created)/86400000)+1);
  return Math.round(totalCheckins(h)/days*100);
}

// ====== Ripple Effect ======
function spawnRipple(elem, color) {
  const rect = elem.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (rect.width/2 - size/2) + 'px';
  ripple.style.top = (rect.height/2 - size/2) + 'px';
  ripple.style.background = color + '44';
  elem.style.position = 'relative';
  elem.style.overflow = 'hidden';
  elem.appendChild(ripple);
  setTimeout(()=>ripple.remove(), 700);
}

function buildPulseChart(h) {
  const today = new Date();
  const daysBack = 30;
  const start = addDays(today, -(daysBack-1));
  const points = [];
  let maxVal = 0;
  for (let i=0; i<daysBack; i++) {
    const d = addDays(start, i);
    const ds = dateStr(d);
    let val = 0;
    if (h.checkins[ds]) {
      // weighted by streak position
      val = 1;
    }
    points.push({date: d, val: val});
    if (val > maxVal) maxVal = val;
  }
  const w = 320, hH = 80, pad = 8;
  const cw = w - pad*2, chH = hH - pad*2;
  const stepX = cw / (daysBack-1);
  let barHTML = '';
  for (let i=0; i<daysBack; i++) {
    const p = points[i];
    const x = pad + i*stepX;
    const barW = Math.max(2, stepX - 2);
    const isToday = dateStr(p.date) === todayStr();
    const fillColor = p.val ? h.color : '#21262D';
    const opacity = p.val ? 1 : 0.5;
    barHTML += `<rect x="${x-barW/2}" y="${pad + chH - 4}" width="${barW}" height="4" rx="2" fill="${fillColor}" opacity="${opacity}"/>`;
  }
  // line path connecting filled days with target line
  let lineD = '';
  for (let i=0; i<daysBack; i++) {
    const p = points[i];
    if (!p.val) continue;
    const x = pad + i*stepX;
    lineD += (lineD ? ' L' : 'M') + x + ' ' + (pad - 2);
  }
  return `<svg viewBox="0 0 ${w} ${hH}" width="100%" height="${hH}" style="display:block">
    ${barHTML}
    ${lineD ? `<path d="${lineD}" stroke="${h.color}" stroke-width="1.5" fill="none" opacity="0.4"/>` : ''}
    <line x1="${pad}" y1="${pad + chH}" x2="${w-pad}" y2="${pad + chH}" stroke="#21262D" stroke-width="1"/>
  </svg>`;
}

function buildHeatmap(h) {
  const today = new Date();
  const todayD = today.getDate();
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth()+1, 0);
  const firstDayOfWeek = monthStart.getDay()===0?6:monthStart.getDay()-1;
  const totalDays = monthEnd.getDate();
  const weeks = Math.ceil((totalDays + firstDayOfWeek) / 7);
  const todayS = todayStr();
  const dayLabels = ['一','二','三','四','五','六','日'];

  let html = '<div class="heatmap-grid">';
  for (let r=0;r<7;r++) {
    html += `<div class="day-label">${dayLabels[r]}</div>`;
    for (let c=0;c<weeks;c++) {
      const dayIdx = c*7+r-firstDayOfWeek;
      if (dayIdx<0 || dayIdx>=totalDays) { html += '<div class="heatmap-cell future"></div>'; continue; }
      const d = new Date(today.getFullYear(), today.getMonth(), dayIdx+1);
      const ds = dateStr(d);
      const checked = !!h.checkins[ds];
      const isToday = ds===todayS;
      const inFuture = d>today;
      let bgStyle = '';
      if (checked) bgStyle = `background:${h.color};color:#fff`;
      html += `<div class="heatmap-cell${checked?' filled':''}${isToday?' today':''}${inFuture&&!checked?' future':''}" style="${bgStyle}">${dayIdx+1}</div>`;
    }
  }
  html += '</div><div class="heatmap-legend"><span class="dot"></span>未打卡 <span class="dot filled" style="background:'+h.color+'"></span>已打卡</div>';
  return html;
}

// ====== Insights Page ======
function renderInsights() {
  const page = document.getElementById('insightsPage');
  if (!habits.length) {
    page.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#484F58">暂无习惯数据</div>';
    return;
  }
  const today = todayStr();
  const todayDone = habits.filter(h=>h.checkins[today]).length;
  const totalCheckinsAll = habits.reduce((s,h)=>s+totalCheckins(h),0);
  const maxStreaks = habits.map(h=>longestStreak(h));
  const bestStreak = Math.max(...maxStreaks);
  const allBadges = [
    {icon:'\u{1F48E}',days:365,name:'钻石'},
    {icon:'\u{1F947}',days:100,name:'金牌'},
    {icon:'\u{1F948}',days:30,name:'银牌'},
    {icon:'\u{1F949}',days:7,name:'铜牌'}
  ];
  const badgeHTML = allBadges.map(b=>{
    const earned = bestStreak >= b.days;
    return `<div class="badge-item${earned?' earned':''}"><div class="badge-icon">${b.icon}</div><div class="badge-days">${b.days} 天</div><div class="badge-status">${earned?'已获得':'未达成'}</div></div>`;
  }).join('');

  // Weekly progress bars
  const barHTML = habits.map(h => {
    const wp = weekProgress(h);
    const pct = Math.round(wp.done/wp.target*100);
    return `<div class="bar-row">
      <span class="bar-label" style="color:${h.color}">${h.icon} ${escH(h.name)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${h.color}"></div></div>
      <span class="bar-pct">${pct}%</span>
    </div>`;
  }).join('');

  // Trend line: last 14 days total
  const todayD = new Date();
  let trendPoints = [];
  for (let i=13; i>=0; i--) {
    const d = addDays(todayD, -i);
    const ds = dateStr(d);
    let count = 0;
    habits.forEach(h => { if (h.checkins[ds]) count++; });
    trendPoints.push({date: d, val: count});
  }
  const maxV = Math.max(1, ...trendPoints.map(p => p.val));
  const tw = 320, th = 100, tp = 8;
  const tcw = tw - tp*2, tch = th - tp*2;
  const tstepX = tcw / (trendPoints.length-1);
  let pathD = '';
  let areaD = '';
  trendPoints.forEach((p, i) => {
    const x = tp + i*tstepX;
    const y = tp + tch - (p.val/maxV)*tch;
    pathD += (i===0?'M':' L') + x + ',' + y;
    if (i===0) areaD += 'M' + x + ',' + (tp+tch) + ' L' + x + ',' + y;
    else areaD += ' L' + x + ',' + y;
  });
  areaD += ' L' + (tp + (trendPoints.length-1)*tstepX) + ',' + (tp+tch) + ' Z';

  const dotsSVG = trendPoints.map((p,i) => {
    const x = tp + i*tstepX;
    const y = tp + tch - (p.val/maxV)*tch;
    return `<circle cx="${x}" cy="${y}" r="2.5" fill="#58A6FF"/>`;
  }).join('');

  page.innerHTML = `
    <div class="section-title">总览</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">
      <div class="stat-card"><div class="val">${habits.length}</div><div class="lbl">习惯总数</div></div>
      <div class="stat-card"><div class="val">${totalCheckinsAll}</div><div class="lbl">累计打卡</div></div>
      <div class="stat-card"><div class="val">${todayDone}/${habits.length}</div><div class="lbl">今日完成</div></div>
      <div class="stat-card"><div class="val">${bestStreak}</div><div class="lbl">最佳连续</div></div>
    </div>
    <div class="section-title">能量里程碑</div>
    <div class="badge-wall">${badgeHTML}</div>
    <div class="section-title">本周完成</div>
    <div class="pulse-chart">${barHTML}</div>
    <div class="section-title">14 日趋势</div>
    <div class="trend-chart">
      <svg viewBox="0 0 ${tw} ${th}" width="100%" height="${th}">
        ${areaD ? `<path d="${areaD}" fill="rgba(88,166,255,0.12)"/>` : ''}
        ${pathD ? `<path d="${pathD}" stroke="#58A6FF" stroke-width="2" fill="none"/>` : ''}
        ${dotsSVG}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#484F58;margin-top:6px">
        <span>14 天前</span><span>今天</span>
      </div>
    </div>
  `;
}

function openEditModal(id) {

  const freqRange = document.getElementById('freqRange');
  const freqVal = document.getElementById('freqVal');

  const colorGrid = document.getElementById('colorGrid');
  emojiGrid.innerHTML = EMOJIS.map(e=>`<button type="button" class="emoji-opt" data-emoji="${e}">${e}</button>`).join('');
  colorGrid.innerHTML = COLORS.map(c=>`<button type="button" class="color-opt" style="background:${c}" data-color="${c}"></button>`).join('');

  let selEmoji=EMOJIS[0], selColor=COLORS[0];

    nameInput.value=h.name;
    freqRange.value=h.targetFrequency;
    freqVal.textContent=h.targetFrequency;
    deleteBtn.style.display='block';
    selEmoji=h.icon; selColor=h.color;
  } else {
    title.textContent='新建习惯';
    nameInput.value='';
    freqRange.value=7;
    freqVal.textContent='7';
    deleteBtn.style.display='none';
  }

  const setSel = (sel, val) => document.querySelector(`[data-${sel}="${val}"]`)?.classList.add('selected');
  setSel('emoji', selEmoji); setSel('color', selColor);

  freqRange.oninput = () => { freqVal.textContent = freqRange.value; };
  emojiGrid.onclick = (e) => {
    const el = e.target.closest('.emoji-opt'); if(!el) return;
    emojiGrid.querySelectorAll('.emoji-opt').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected'); selEmoji=el.dataset.emoji;
  };
  colorGrid.onclick = (e) => {
    const el = e.target.closest('.color-opt'); if(!el) return;
    colorGrid.querySelectorAll('.color-opt').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected'); selColor=el.dataset.color;
  };

  document.getElementById('saveHabitBtn').onclick = () => {
    const name = nameInput.value.trim();
    if(!name){showToast('请输入习惯名称');return;}
    const freq = parseInt(freqRange.value);
    if(id){
      const h=habits.find(x=>x.id===id);
      if(h){ h.name=name; h.icon=selEmoji; h.color=selColor; h.targetFrequency=freq; }
    } else {
      habits.push({id:Date.now(),name,icon:selEmoji,color:selColor,targetFrequency:freq,createdAt:todayStr(),checkins:{}});
    }
    saveHabits(); renderAll(); closeEdit();
  };

  deleteBtn.onclick = () => {
    if(!confirm('确定删除？所有打卡记录将丢失。')) return;
    deleteHabit(id); closeEdit();
  };

  document.getElementById('editModal').classList.add('show');
}

document.getElementById('editModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeEdit(); });
document.getElementById('detailModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeDetail(); });
document.getElementById('settingsModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeSettings(); });

// ====== Reminder ======
function checkReminder() {
  if(!settings.reminderEnabled || Notification.permission !== 'granted') return;
  const now = new Date();
  const timeStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(timeStr !== settings.reminderTime) return;
  const today = todayStr();
  const unchecked = habits.filter(h=>!h.checkins[today]);
  if(unchecked.length === 0) return;
  const lastReminder = sessionStorage.getItem('last_reminder_date');
  if(lastReminder === today) return;
  sessionStorage.setItem('last_reminder_date', today);
  new Notification('习惯打卡', {body:`还有 ${unchecked.length} 个习惯未完成，加油！`, tag:'habit-reminder'});
}

// ====== Bottom Nav ======
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentTab = item.dataset.tab;
    switchTab();
  });
});

function switchTab() {
  const overview = document.getElementById('overviewCard');
  const habitList = document.getElementById('habitList');
  const addCard = document.getElementById('addHabitCard');
  const calendarPage = document.getElementById('calendarPage');
  const insightsPage = document.getElementById('insightsPage');
  const settingsPage = document.getElementById('settingsPage');

  const hide = el => el.style.display = 'none';
  const show = el => el.style.display = '';

  if (currentTab === 'habits') {
    show(overview); show(habitList); show(addCard);
    hide(calendarPage); hide(insightsPage); hide(settingsPage);
  } else if (currentTab === 'calendar') {
    hide(overview); hide(habitList); hide(addCard);
    hide(insightsPage); hide(settingsPage);
    show(calendarPage); renderCalendar();
  } else if (currentTab === 'insights') {
    hide(overview); hide(habitList); hide(addCard);
    hide(calendarPage); hide(settingsPage);
    show(insightsPage); renderInsights();
  } else if (currentTab === 'settings') {
    hide(overview); hide(habitList); hide(addCard);
    hide(calendarPage); hide(insightsPage);
    show(settingsPage); renderSettings();
  }
}

// ====== PWA ======
if('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }

// ====== Render All ======
function renderAll() {
  updateDate();
  renderOverview();
  renderHabits();
  if (currentTab === 'calendar') renderCalendar();
  if (currentTab === 'insights') renderInsights();
  if (currentTab === 'settings') renderSettings();
}

// ====== Init ======
renderAll();
setInterval(checkReminder, 30000);
</script>
